<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap demo</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <!-- 상단 버튼  -->
    <div class="d-flex gap-2 justify-content-center py-5">
        <button class="btn btn-primary rounded-pill px-3" type="button">
            Primary
        </button>

        <button class="btn btn-secondary rounded-pill px-3" type="button">
            Secondary
        </button>

        <button class="btn btn-success rounded-pill px-3" type="button">
            Success
        </button>

        <button class="btn btn-danger rounded-pill px-3" type="button">
            Danger
        </button>

        <button class="btn btn-warning rounded-pill px-3" type="button">
            Warning
        </button>

        <button class="btn btn-info rounded-pill px-3" type="button">
            Info
        </button>

        <button class="btn btn-light rounded-pill px-3" type="button">
            Light
        </button>

        <button class="btn btn-dark rounded-pill px-3" type="button">
            Dark
        </button>

        <button class="btn btn-link rounded-pill px-3" type="button">
            Link
        </button>
    </div>


    <!-- 중단 버튼 -->>
    <div class="col-lg-6 col-xxl-4 my-5 mx-auto">
        <div class="d-grid gap-2">

            <button class="btn btn-outline-secondary" type="button">
                Secondary action
            </button>

            <button class="btn btn-primary" type="button">
                Primary action
            </button>

        </div>
    </div>


    <!-- Icoon이 있는 버튼 -->
    <div class="d-flex gap-2 justify-content-center py-5">

        <button class="btn btn-primary d-inline-flex align-items-center" type="button" >
            Primary icon
            <i class="bi bi-arrow-right-short ms-1"></i>
        </button>

        <button class="btn btn-outline-secondary d-inline-flex align-items-center" type="button">
            Secondary icon
            <i class="bi bi-arrow-right-short ms-1"></i>
        </button>

    </div>


    <!-- Loading buttons -->
    <div class="d-flex gap-2 justify-content-center py-5">

        <button class="btn btn-primary" type="button" disabled>
            <span
                class="spinner-border spinner-border-sm"
                aria-hidden="true"
            ></span>

            <span class="visually-hidden" role="status">
                Loading...
            </span>
        </button>


        <button class="btn btn-primary" type="button" disabled>

            <span
                class="spinner-border spinner-border-sm"
                aria-hidden="true"
            ></span>

            <span role="status">
                Loading...
            </span>

        </button>

    </div>


    <!-- Small round X buttons -->
    <div class="d-flex gap-2 justify-content-center pt-5 pb-4">

        <button
            class="btn btn-primary rounded-circle p-2 lh-1"
            type="button"
        >
            <i class="bi bi-x-lg"></i>

            <span class="visually-hidden">
                Dismiss
            </span>
        </button>


        <button
            class="btn btn-outline-primary rounded-circle p-2 lh-1"
            type="button"
        >
            <i class="bi bi-x-lg"></i>

            <span class="visually-hidden">
                Dismiss
            </span>
        </button>

    </div>


    <!-- Large round X buttons -->
    <div class="d-flex gap-2 justify-content-center pb-5">

        <button
            class="btn btn-primary rounded-circle p-3 lh-1"
            type="button"
        >
            <i class="bi bi-x-lg fs-4"></i>

            <span class="visually-hidden">
                Dismiss
            </span>
        </button>


        <button
            class="btn btn-outline-primary rounded-circle p-3 lh-1"
            type="button"
        >
            <i class="bi bi-x-lg fs-4"></i>

            <span class="visually-hidden">
                Dismiss
            </span>
        </button>

    </div>

</body>

</html>
