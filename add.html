<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운동 기록 추가</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    <!-- Wood Tone 커스텀 스타일 (Bootstrap override) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5" style="max-width: 600px;">

    <!-- 페이지 헤더 -->
    <h2 class="mb-4">🏋️ 운동 기록 추가</h2>

    <form id="addForm">

        <!-- 날짜: type="date" 로 날짜 선택 UI 제공, 필수 항목 -->
        <div class="mb-3">
            <label class="form-label fw-bold">날짜 <span class="text-danger">*</span></label>
            <input type="date" id="date" class="form-control">
        </div>

        <!-- 종목: 텍스트 입력, 필수 항목 -->
        <div class="mb-3">
            <label class="form-label fw-bold">종목 <span class="text-danger">*</span></label>
            <input type="text" id="sport" class="form-control" placeholder="예) 러닝, 수영, 헬스">
        </div>

        <!-- 운동시간: 숫자 입력 (1~300분), 필수 항목 -->
        <div class="mb-3">
            <label class="form-label fw-bold">운동시간(분) <span class="text-danger">*</span></label>
            <input type="number" id="time" class="form-control" placeholder="1 ~ 300">
        </div>

        <!-- 칼로리: 숫자 입력, 선택 항목 -->
        <div class="mb-3">
            <label class="form-label fw-bold">칼로리(kcal)</label>
            <input type="number" id="cal" class="form-control" placeholder="예) 300">
        </div>

        <!-- 강도: select 드롭다운, 필수 항목 -->
        <div class="mb-3">
            <label class="form-label fw-bold">강도 <span class="text-danger">*</span></label>
            <select id="intensity" class="form-select">
                <option value="">-- 선택하세요 --</option>
                <option value="낮음">낮음</option>
                <option value="보통">보통</option>
                <option value="높음">높음</option>
            </select>
        </div>

        <!-- 메모: 여러 줄 텍스트, 100자 이내 -->
        <div class="mb-3">
            <label class="form-label fw-bold">메모</label>
            <textarea id="memo" class="form-control" rows="3" placeholder="100자 이내로 입력"></textarea>
        </div>

        <!-- 달성여부: 체크박스 -->
        <div class="mb-4 form-check">
            <input type="checkbox" id="done" class="form-check-input">
            <label class="form-check-label" for="done">목표 달성</label>
        </div>

        <!-- 버튼 영역 -->
        <div class="d-flex gap-2">
            <!-- 추가 버튼: JS 함수 호출 -->
            <button type="button" class="btn btn-primary" onclick="submitForm()">
                <i class="bi bi-check-lg"></i> 추가
            </button>
            <!-- 취소 버튼: 목록 페이지로 이동 -->
            <a href="index.html" class="btn btn-secondary">취소</a>
        </div>

    </form>

</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    function submitForm() {

        // 각 입력 필드의 값을 가져옴
        const date      = document.getElementById("date").value;
        const sport     = document.getElementById("sport").value.trim(); // trim(): 앞뒤 공백 제거
        const time      = Number(document.getElementById("time").value); // Number(): 문자열 → 숫자 변환
        const intensity = document.getElementById("intensity").value;
        const memo      = document.getElementById("memo").value;

        // Validation 1: 날짜 필수 입력 확인
        // date가 빈 문자열이면 !date 는 true
        if (!date) {
            alert("날짜를 입력해주세요.");
            return; // return으로 함수 종료 → 이후 코드 실행 안 됨
        }

        // Validation 2: 종목 필수 입력 확인
        if (!sport) {
            alert("종목을 입력해주세요.");
            return;
        }

        // Validation 3: 운동시간 숫자 범위 확인 (1 ~ 300)
        // !time 은 0 또는 빈값, || 로 범위도 함께 체크
        if (!time || time < 1 || time > 300) {
            alert("운동시간은 1~300분 사이로 입력해주세요.");
            return;
        }

        // Validation 4: 강도 선택 여부 확인
        // select의 기본값이 "" 이므로 비어있으면 미선택
        if (!intensity) {
            alert("강도를 선택해주세요.");
            return;
        }

        // Validation 5: 메모 글자수 100자 이하 확인
        if (memo.length > 100) {
            alert("메모는 100자 이내로 입력해주세요.");
            return;
        }

        // ===== 실제 서비스에서는 이 데이터를 서버로 POST 요청 =====
        // 모든 검사 통과 → confirm으로 최종 확인
        const ok = confirm("운동 기록이 추가됩니다.");

        // 확인(OK) 클릭 시 목록 페이지로 이동
        if (ok) {
            window.location.href = "index.html";
        }
        // 취소 클릭 시 아무 동작 없이 폼 유지
    }

</script>

</body>
</html>
