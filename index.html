<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운동 기록 관리</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>
<body>

<div class="container mt-5">

    <!-- 페이지 헤더: 타이틀 + Add 버튼 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🏋️ 운동 기록 관리</h2>
        <!-- Add 버튼 클릭 시 add.html로 이동 -->
        <a href="add.html" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Add
        </a>
    </div>

    <!-- 운동 기록 테이블: 6개 컬럼 표시 -->
    <table class="table table-hover table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>번호</th>
                <th>날짜</th>
                <th>종목</th>
                <th>운동시간(분)</th>
                <th>칼로리</th>
                <th>달성여부</th>
            </tr>
        </thead>
        <!-- JS가 아래 tbody에 행을 동적으로 추가함 -->
        <tbody id="tableBody"></tbody>
    </table>

</div>

<!-- Bootstrap JS bundle (드롭다운 등 컴포넌트 동작용) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    // ===== 하드코딩 샘플 데이터 (실제 서비스에서는 API로 대체) =====
    const workouts = [
        { id: 1, date: "2025-06-01", sport: "러닝",   time: 40, cal: 350, intensity: "보통", memo: "한강공원",      done: true  },
        { id: 2, date: "2025-06-03", sport: "수영",   time: 60, cal: 500, intensity: "높음", memo: "자유형 위주",   done: true  },
        { id: 3, date: "2025-06-05", sport: "헬스",   time: 90, cal: 420, intensity: "높음", memo: "가슴/삼두",     done: false },
        { id: 4, date: "2025-06-07", sport: "자전거", time: 50, cal: 300, intensity: "낮음", memo: "공원 라이딩",   done: true  },
        { id: 5, date: "2025-06-09", sport: "요가",   time: 60, cal: 180, intensity: "낮음", memo: "스트레칭 중심", done: false },
    ];
    // ===== 하드코딩 끝 =====

    // tbody 요소를 가져옴
    const tbody = document.getElementById("tableBody");

    // 배열을 순회하며 각 레코드를 테이블 행으로 만들어 추가
    workouts.forEach(function(w) {

        // 달성여부를 Bootstrap 뱃지로 표시
        const doneBadge = w.done
            ? '<span class="badge bg-success">완료</span>'
            : '<span class="badge bg-secondary">미완료</span>';

        // 종목명을 <a> 태그로 감싸 클릭 시 view.html로 이동
        const row = `
            <tr>
                <td>${w.id}</td>
                <td>${w.date}</td>
                <td><a href="view.html">${w.sport}</a></td>
                <td>${w.time}분</td>
                <td>${w.cal} kcal</td>
                <td>${doneBadge}</td>
            </tr>
        `;

        // tbody에 행 추가
        tbody.innerHTML += row;
    });

</script>

</body>
</html>
