<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운동 기록 수정</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    <!-- Wood Tone 커스텀 스타일 (Bootstrap override) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5" style="max-width: 600px;">

    <!-- 페이지 헤더 -->
    <h2 class="mb-4">🏋️ 운동 기록 수정</h2>

    <!-- add.html과 동일한 폼 구조 (필드 7개) -->
    <form id="editForm">

        <div class="mb-3">
            <label class="form-label fw-bold">날짜 <span class="text-danger">*</span></label>
            <input type="date" id="date" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">종목 <span class="text-danger">*</span></label>
            <input type="text" id="sport" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">운동시간(분) <span class="text-danger">*</span></label>
            <input type="number" id="time" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">칼로리(kcal)</label>
            <input type="number" id="cal" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">강도 <span class="text-danger">*</span></label>
            <select id="intensity" class="form-select">
                <option value="">-- 선택하세요 --</option>
                <option value="낮음">낮음</option>
                <option value="보통">보통</option>
                <option value="높음">높음</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">메모</label>
            <textarea id="memo" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-4 form-check">
            <input type="checkbox" id="done" class="form-check-input">
            <label class="form-check-label" for="done">목표 달성</label>
        </div>

        <div class="d-flex gap-2">
            <!-- 저장 버튼: JS Validation 후 alert → view.html 이동 -->
            <button type="button" class="btn btn-primary" onclick="submitEdit()">
                <i class="bi bi-floppy"></i> 저장
            </button>
            <!-- 취소 버튼: 상세 페이지로 이동 -->
            <a href="view.html" class="btn btn-secondary">취소</a>
        </div>

    </form>

</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    // ===== 하드코딩된 기존 데이터로 폼을 미리 채움 (실제 서비스에서는 URL 파라미터로 조회 후 바인딩) =====
    const existing = {
        date:      "2025-06-01",
        sport:     "러닝",
        time:      40,
        cal:       350,
        intensity: "보통",
        memo:      "한강공원",
        done:      true
    };
    // ===== 하드코딩 끝 =====

    // window.onload: 페이지가 완전히 로드된 뒤 실행
    // 기존 데이터를 각 input 필드에 바인딩
    window.onload = function () {
        document.getElementById("date").value      = existing.date;
        document.getElementById("sport").value     = existing.sport;
        document.getElementById("time").value      = existing.time;
        document.getElementById("cal").value       = existing.cal;
        document.getElementById("intensity").value = existing.intensity; // select의 value를 맞춰주면 자동 선택됨
        document.getElementById("memo").value      = existing.memo;
        document.getElementById("done").checked    = existing.done;      // checkbox는 .checked 속성으로 설정
    };

    function submitEdit() {

        // 수정된 값 가져오기
        const date      = document.getElementById("date").value;
        const sport     = document.getElementById("sport").value.trim();
        const time      = Number(document.getElementById("time").value);
        const intensity = document.getElementById("intensity").value;
        const memo      = document.getElementById("memo").value;

        // Validation 1: 날짜 필수 입력 확인
        if (!date) {
            alert("날짜를 입력해주세요.");
            return;
        }

        // Validation 2: 종목 필수 입력 확인
        if (!sport) {
            alert("종목을 입력해주세요.");
            return;
        }

        // Validation 3: 운동시간 범위 확인 (1 ~ 300)
        if (!time || time < 1 || time > 300) {
            alert("운동시간은 1~300분 사이로 입력해주세요.");
            return;
        }

        // Validation 4: 강도 선택 여부 확인
        if (!intensity) {
            alert("강도를 선택해주세요.");
            return;
        }

        // Validation 5: 메모 100자 이하 확인
        if (memo.length > 100) {
            alert("메모는 100자 이내로 입력해주세요.");
            return;
        }

        // 모든 검사 통과 → 수정 완료 메시지
        alert("운동 기록이 수정되었습니다.");

        // 상세 페이지로 이동
        window.location.href = "view.html";
    }

</script>

</body>
</html>
